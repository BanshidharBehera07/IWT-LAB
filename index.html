<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lecture 12 javascript</title>
</head>
<body>
    <h3>Print Array elements ??</h3>
    <script>
         a=new Array(10,15,45,7,4,8,5,2,1,6,9)
        for(let c of a){
            document.writeln(c)
        }
       console.log(a)
    </script>
    <h3>Reversing of an array....</h3>
    <script>
        a.reverse();
        document.writeln(a)
    </script>
    <h3>Sorting an array....</h3>
    <script>
        a.sort((a,b)=>a-b);
        document.writeln(a)
    </script>
</body>
</html>
