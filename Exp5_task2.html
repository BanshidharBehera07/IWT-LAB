<!DOCTYPE html>
<html lang="en">
<head>

    <title>Exp5_Task2_Factorial</title>
</head>
<body>
    <h3>Factorial of a number</h3>
    <script>
let num = 5;
let factorial = 1;

for (let i = 1; i <= num; i++) {
    factorial *= i;
}

console.log(`Factorial of ${num} is ${factorial}`);

    </script>
</body>
</html>
