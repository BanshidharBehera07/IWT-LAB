<body>
    <h3>Know your grade...</h3>
    <script>
var grade=90;
if (grade>=90){
    console.log("Grade A")
}
else if (grade>=75){
    console.log("Grade B")
}
else if(grade>=50){
    console.log("Grade C")
}
else{
    console.log("Fail")
}
    </script>
