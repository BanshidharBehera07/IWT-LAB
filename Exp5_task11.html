<html>
<head>
    <title>Question 11 - Write a function reverseArray(arr) that reverses the elements of an array without using the built-in reverse() method.</title>
	
</head>
<body>
<script>
function reverseArray(arr) {
    let left = 0;
    let right = arr.length - 1;

    while (left < right) {
        let temp = arr[left];
        arr[left] = arr[right];
        arr[right] = temp;

        left++;
        right--;
    }

    return arr;
}

console.log(reverseArray([1, 2, 3, 4, 5]));

</script>
</body>
</html>
