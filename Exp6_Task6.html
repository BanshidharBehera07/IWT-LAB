<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Currency Converter</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; background-color: #f4f4f4; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        h2 { margin-top: 0; }
        label { display: block; margin: 10px 0 5px; font-size: 14px; }
        select, input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: black; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        #error { color: red; font-size: 13px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Currency Converter</h2>
    <p id="error"></p>

    <label>From:</label>
    <select id="fromCurr">
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
        <option value="INR">INR</option>
        <option value="AUD">AUD</option>
    </select>

    <input type="number" id="amount" placeholder="Enter amount">

    <label>To:</label>
    <select id="toCurr">
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
        <option value="INR" selected>INR</option>
        <option value="AUD">AUD</option>
    </select>

    <input type="text" id="result" placeholder="Converted amount" readonly>

    <button onclick="convert()">Convert</button>
</div>

<script>
    const conversionRates = {
        USD: { EUR: 0.93, GBP: 0.82, INR: 82.74, AUD: 1.47 },
        EUR: { USD: 1.08, GBP: 0.88, INR: 89.06, AUD: 1.58 },
        GBP: { USD: 1.22, EUR: 1.14, INR: 101.5, AUD: 1.80 },
        INR: { USD: 0.012, EUR: 0.011, GBP: 0.0098, AUD: 0.018 },
        AUD: { USD: 0.68, EUR: 0.63, GBP: 0.55, INR: 55.87 }
    };

    function convert() {
        const from = document.getElementById('fromCurr').value;
        const to = document.getElementById('toCurr').value;
        const amount = document.getElementById('amount').value;
        const errorEl = document.getElementById('error');
        const resultEl = document.getElementById('result');

        // Reset display
        errorEl.style.display = "none";
        resultEl.value = "";

        // Validation Logic
        if (amount === "" || amount <= 0) {
            showError("Please enter a valid amount.");
            return;
        }
        if (from === to) {
            showError("Source and target currencies cannot be the same.");
            return;
        }

        // Calculation
        const rate = conversionRates[from][to];
        const convertedAmount = (amount * rate).toFixed(2);
        
        resultEl.value = convertedAmount;
    }

    function showError(msg) {
        const errorEl = document.getElementById('error');
        errorEl.textContent = msg;
        errorEl.style.display = "block";
    }
</script>

</body>
</html>
